name: Rozkład MPK

# Wynik trafia na gałąź `dane` (jeden commit, nadpisywany), a telefon pobiera go przez jsDelivr:
#   https://cdn.jsdelivr.net/gh/maciek971/tramwaj-dane@dane/wersja.json      (mały, czyszczony z cache)
#   https://cdn.jsdelivr.net/gh/maciek971/tramwaj-dane@dane/v/<źródło>/mpk.json (nowa ścieżka = świeży plik)
# KaiOS 2.5 nie ufa certyfikatom Let's Encrypt, więc GitHub Pages i raw.githubusercontent.com odpadają.

on:
  schedule:
    - cron: '30 3 * * *'   # codziennie 03:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rozklad
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy
        run: python -m unittest -v
      - name: Zbuduj rozkład
        env:
          TZ: Europe/Warsaw
        run: python zbuduj_rozklad.py --out public
      - name: Opublikuj na gałęzi dane
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          NOWE=$(python -c "import json;print(json.load(open('public/wersja.json'))['id'])")
          mkdir stare nowe
          git -C stare init -q
          set +e; git ls-remote --exit-code --heads "$REPO" dane >/dev/null; RC=$?; set -e
          if [ $RC -eq 0 ]; then
            # gałąź istnieje: bez jej zawartości nie publikujemy (zgubilibyśmy rozklad.json v1 i poprzednią paczkę)
            git -C stare fetch -q --depth 1 "$REPO" dane
            git -C stare checkout -q FETCH_HEAD
            STARE=$(python -c "import json;print(json.load(open('stare/wersja.json')).get('id',''))" 2>/dev/null || true)
            STARA_PACZKA=$(python -c "import json;print(json.load(open('stare/wersja.json')).get('paczka',''))" 2>/dev/null || true)
          elif [ $RC -eq 2 ]; then
            STARE=''; STARA_PACZKA=''   # pierwsza publikacja
          else
            echo "Nie udało się sprawdzić gałęzi dane (kod $RC), nie publikuję."; exit 1
          fi
          echo "stare=$STARE nowe=$NOWE"
          if [ "$STARE" = "$NOWE" ] && [ -f "stare/v/$NOWE/mpk.json" ]; then   # id = źródło + skrót treści
            echo 'Rozkład bez zmian, nie publikuję.'
            exit 0
          fi
          mkdir -p "nowe/v/$NOWE"
          cp public/wersja.json nowe/wersja.json
          cp public/mpk.json "nowe/v/$NOWE/mpk.json"
          if [ -n "$STARA_PACZKA" ] && [ "$STARA_PACZKA" != "v/$NOWE/mpk.json" ] && [ -f "stare/$STARA_PACZKA" ]; then
            mkdir -p "nowe/$(dirname "$STARA_PACZKA")" && cp "stare/$STARA_PACZKA" "nowe/$STARA_PACZKA"   # poprzednia wersja
          fi
          [ -f stare/rozklad.json ] && cp stare/rozklad.json nowe/rozklad.json   # format v1 dla starej wersji aplikacji
          cd nowe
          git init -q -b dane
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Rozkład $NOWE"
          git push -q --force "$REPO" dane
          curl -fsS https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@dane/wersja.json || true
