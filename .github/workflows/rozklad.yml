name: Rozkład MPK

# Wynik trafia na gałąź `dane` (jeden commit, nadpisywany), a telefon pobiera go przez jsDelivr:
#   https://cdn.jsdelivr.net/gh/maciek971/tramwaj-dane@dane/wersja.json      (mały, czyszczony z cache)
#   https://cdn.jsdelivr.net/gh/maciek971/tramwaj-dane@dane/v/<źródło>/mpk.json (nowa ścieżka = świeży plik)
# KaiOS 2.5 nie ufa certyfikatom Let's Encrypt, więc GitHub Pages i raw.githubusercontent.com odpadają.

on:
  schedule:
    - cron: '30 3 * * *'   # codziennie 03:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rozklad
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy
        run: python -m unittest -v
      - name: Zbuduj rozkład
        env:
          TZ: Europe/Warsaw
        run: python zbuduj_rozklad.py --out public
      - name: Opublikuj na gałęzi dane
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          NOWE=$(python -c "import json;print(json.load(open('public/wersja.json'))['source'])")
          mkdir stare nowe
          if git -C stare init -q && git -C stare fetch -q --depth 1 "$REPO" dane && git -C stare checkout -q FETCH_HEAD; then
            STARE=$(python -c "import json;print(json.load(open('stare/wersja.json')).get('source',''))" 2>/dev/null || true)
          else
            STARE=''
          fi
          echo "stare=$STARE nowe=$NOWE"
          if [ "$STARE" = "$NOWE" ] && [ -f "stare/v/$NOWE/mpk.json" ] && python - "$NOWE" <<'EOF'
          import json, sys
          a = json.load(open('stare/v/%s/mpk.json' % sys.argv[1])); b = json.load(open('public/mpk.json'))
          a.pop('generated', None); b.pop('generated', None)
          sys.exit(0 if a == b else 1)
          EOF
          then
            echo 'Rozkład bez zmian, nie publikuję.'
            exit 0
          fi
          mkdir -p "nowe/v/$NOWE"
          cp public/wersja.json nowe/wersja.json
          cp public/mpk.json "nowe/v/$NOWE/mpk.json"
          if [ -n "$STARE" ] && [ "$STARE" != "$NOWE" ] && [ -f "stare/v/$STARE/mpk.json" ]; then
            mkdir -p "nowe/v/$STARE" && cp "stare/v/$STARE/mpk.json" "nowe/v/$STARE/mpk.json"
          fi
          [ -f stare/rozklad.json ] && cp stare/rozklad.json nowe/rozklad.json   # format v1 dla starej wersji aplikacji
          cd nowe
          git init -q -b dane
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Rozkład $NOWE"
          git push -q --force "$REPO" dane
          curl -fsS https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@dane/wersja.json || true
